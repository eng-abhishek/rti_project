<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DHC RTI</title>

  <link rel="stylesheet" href="assets/css/bootstarp.min.css">
  <link rel="stylesheet" href="assets/css/bootstrap-icons.min.css">
  <link rel="stylesheet" href="assets/fonts/bootstrap-icons.woff">
  <link rel="stylesheet" href="assets/fonts/bootstrap-icons.woff2">
  <link href="assets/backend/css/jquery.dataTables.min.css" rel="stylesheet" />
  <link href="assets/backend/css/dataTables.bootstrap5.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>

<body>
  <main class="cd__main">

    <header class="header_bg ">
      <div class="container-fluid">
        <div class="row">
          <div class="col-md-12">
            <div class="parent_header">
              <div class="logo_dashbiar">
                <img src="assets/images/logo.png" alt="">
                <div class="logo-content">
                  <a href="#">
                    <h4>High Court of Delhi</h4>
                    <h4>RTI System</h4>
                  </a>
                </div>
                <a href="#!" class="menu-toggle custom_menu_toggle"><i class="bi bi-list"></i></a>
              </div>

              <div class="user_logIn-">
                <div class="dropdown">
                  <button class="dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                    Welcome
                  </button>
                  <ul class="dropdown-menu">
                    <li class="Profiel_name">TEST</li>
                    <li><a class="dropdown-item" href="#">Profile</a></li>
                    <li><a class="dropdown-item" href="#">Logout</a></li>
                  </ul>
                </div>
                <div class="profile">
                  <img src="assets/images/user.png" alt="user" class="emblem">
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </header>

    <div class='dashboard'>
      <!-- Sidebar -->

      <div class="dashboard-nav sidebar">
        <a href="#!" class="menu-toggle cust_mobile__close"><i class="bi bi-x-circle"></i></a>
        <nav class="dashboard-nav-list">
          <a href="#" class="dashboard-nav-item " data-tooltip="Inbox">
            <i class="bi bi-inbox"></i> Dashboard
          </a>
          <a href="#" class="dashboard-nav-item active" data-tooltip="Submit RTI Application">
            <i class="bi bi-person-add"></i> New RTI Request
          </a>
          <a href="#" class="dashboard-nav-item " data-tooltip="Master Page">
            <i class="bi bi-inbox"></i> RTI Inbox
          </a>
          <a href="#" class="dashboard-nav-item " data-tooltip="Master Page">
            <i class="bi bi-person-gear"></i> Edit Profile
          </a>
          <a href="#" class="dashboard-nav-item " data-tooltip="Master Page">
            <i class="bi bi-gear"></i> Change Password
          </a>
          <a href="#" class="dashboard-nav-item" data-tooltip="Master Page">
            <i class="bi bi-box-arrow-right"></i>Logout
          </a>
        </nav>
      </div>

      <div class='dashboard-app main-content bg_dashboard'>


        <div class='container-fluid'>
          <div class="row">
            <div class="col-md-12">
              <div class="form_heading custom_cenetr">
                <h4>Edit Profile</h4>
              </div>
              <div class="bg_inner_div">
                <form method="POST" action="https://delhihighcourt.nic.in/app/rti/profile" class="input_cust"
                  id="validateForm" enctype="multipart/form-data">
                  <input type="hidden" name="_token" value="sIdGZIsV7XQBB50YUL0HhFTEL6jttxkO7JcBIrOw">
                  <div class="row cust_flex_row_dash">

                    <div class="form-group group col-md-6 col-12">
                      <textarea name="address" id="address" maxlength="300" class="form-control cus-form-control h-100"
                        rows="3">Address Data</textarea>
                      <span>(Max Limit 300 Characters only)</span>
                      <!-- <input type="text" class="form-control cus-form-control" placeholder="" value=""> -->
                      <label class="form__label" for="">User address<span>*</span></label>
                      <span class="text-danger">
                      </span>
                    </div>

                    <div class="form-group group col-md-6 col-12">
                      <select name="state" id="displaystate" class="form-control cus-form-control h-100" required="">
                        <option value="">--Select State--</option>
                        <option value="AN">
                          Andman &amp; Nicobar Islands
                        </option>
                      </select>
                      <label class="form__label" for="">State<span>*</span></label>
                      <span class="text-danger">
                      </span>
                    </div>

                    <div class="form-group group col-md-6 col-12">
                      <select name="district" id="displaydistrict" class="form-control cus-form-control" required>
                        <option value="">Select District</option>
                        <option value="ADAP">
                          ADILABAD
                        </option>
                      </select>
                      <label class="form__label" for="">District<span>*</span></label>
                      <span class="text-danger">
                      </span>
                    </div>

                    <div class="form-group group col-md-6 col-12">
                      <input class="form-control cus-form-control" type="text" name="pincode" id="displaypincode"
                        minlength="6" maxlength="6" onkeypress="return isNumber(event)" value="272127">
                      <!-- <input type="text" class="form-control cus-form-control" placeholder="" value=""> -->
                      <label class="form__label" for="">Pin code<span>*</span></label>
                      <span class="text-danger">
                      </span>
                    </div>

                    <div class="form-group group col-md-6 col-12">
                      <input class="form-control cus-form-control" type="text" name="mobileno" id="displaymobileno"
                        minlength="10" maxlength="10" onkeypress="return isNumber(event)" value="7071310320">
                      <label class="form__label" for="">Mobile No<span>*</span></label>
                      <span class="text-danger">
                      </span>
                    </div>

                    <div class="form-group group col-md-6 col-12">
                      <input class="form-control cus-form-control" disabled type="text" value="TEST2026@GMAIL.COM">
                      <label class="form__label" for="">Email ID</label>
                    </div>
                  </div>
              </div>
              <!-- <div class="submit_dis_line">
            <button class="au-btn au-btn--block au-btn--green m-b-20" id="submitid" onclick="process('rtimatter');">Submit</button>
            </div> -->
              <div class="submit_dis_line">
                <button type="submit" id="submitid" class="btn_submit quick-btn">Update</button>

              </div>
              </form>
            </div>
          </div>
        </div>


        
      </div>
    </div>
    </div>


    <!-- Modal -->
    <div class="modal fade" id="otpModal" tabindex="-1" aria-labelledby="otpModalLabel" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title text-center" id="otpModalLabel">Verify Mobile No</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <p class="modal-title text-center pt-1" id="otpText"></p>
          <p class="modal-title text-center text-danger pt-1" id="otpTimer"></p>
          <div class="modal-body">

            <form id="verify-otp-form">
              <div class="mb-3">
                <label for="recipient-name" class="col-form-label">Enter Mobile OTP:</label>
                <input type="number" class="form-control" id="mobile_otp" name="mobile_otp">
              </div>
            </form>

          </div>
          <div class="modal-footer d-flex justify-content-center">
          </div>
        </div>
      </div>
    </div>
  </main>
  <!-- start footer  -->
  <footer class="bg_footer">
    <div class="container">
      <div class="row">
        <div class="col-md-12">
          <div class="footer-content">
            <p>Copyright © 2026. Delhi High Court. All Rights Reserved.</p>
          </div>
        </div>
      </div>
    </div>
  </footer>
  <!-- Edn footer  -->
  </div>
</body>


<script src="assets/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/jquery.min.js"></script>

</html>
