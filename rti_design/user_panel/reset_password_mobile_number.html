<!doctype html>
<html lang="en">

<head>
  <title>DHC RTI</title>
  <link rel="stylesheet" href="./assets/css/bootstarp.min.css">
  <link rel="stylesheet" href="./assets/css/bootstrap-icons.min.css">
  <link rel="stylesheet" href="./assets/css/bootstrap-icons.woff">
  <link rel="stylesheet" href="./assets/css/bootstrap-icons.woff2">
  <link rel="stylesheet" href="./assets/css/style.css">
  <link rel="stylesheet" href="./assets/css/responsive.css">
</head>

<body>
  <div class="main">
    <header class="header_bg">
      <div class="container">
        <div class="row">
          <div class="col-md-12">
            <div class="logo_content login_page_">
              <a href="#">
                <img src="#" alt=""></a>
              <div class="logo-content">
                <h4>High Court of Delhi</h4>
                <h4>RTI System</h4>
              </div>
              <a href="#">
                <img src="./assets/logo/Emblem_of_India.svg" alt="" class="emblem w-100"></a>
            </div>
          </div>
        </div>
      </div>
    </header>

    <!-- start main section  -->
    <section class="bg_spacing">
      <div class="container">
        <div class="bg_drop_shd-login">
          <div class="row">
            <div class="col-md-12 col-lg-12 cus_col_form ">
              <div class="form_heading">
                <h4>Reset Password using mobile number</h4>
                <p id="otp-error"></p>
                <form action="https://delhihighcourt.nic.in/app/rti/reset-password-mobile-number" method="post"
                  class="input_cust" id="resetPassMobileNo">
                  <input type="hidden" name="_token" value="avNB2VOEgKOtjAP22j3dWbJUQ8pVxuifFLMveDKK">
                  <div class="form-group group col-md-12 col-12">
                    <input type="text" class="form-control cus-form-control" placeholder="" name="email_id">
                    <label class="form__label" for="">Username <span class="error">(email ID)</span></label>
                  </div>

                  <div class="form-group group col-md-12 col-12">
                    <input type="text" class="form-control cus-form-control" minlength="10" maxlength="10"
                      name="mobile_no" onkeypress="return isNumber(event)">
                    <label class="form__label" for="">Mobile Number:
                    </label>
                  </div>

                  <div class="row">
                    <div class="col-12 col-md-12 col-lg-5">
                      <div class="form-group form_cust_flex">
                        <label id="cap" class="captcha-label mr-4">
                          <span id="captcha_preview_reset_otp_captcha" class="captcha-code">618375</span>
                        </label>
                        <a href="javascript:refreshCaptcha('_reset_otp_captcha');" id="reload-captcha">
                          <img src="https://delhihighcourt.nic.in/app/rti/public/new_design/images/refresh.png" alt="">
                        </a>
                        <a href="javascript: playAudio('_reset_otp_captcha');">
                          <img
                            src="https://delhihighcourt.nic.in/app/rti/public/new_design/images/volume-high-solid.png"
                            alt="">
                        </a>
                      </div>

                      <audio id="myAudio_reset_otp_captcha">
                        <source src="" type="audio/wav">
                        Your browser does not support the audio element.
                      </audio>
                      <input type="hidden" name="captcha_code_reset_otp_captcha" id="captcha_code_reset_otp_captcha"
                        value="618375">
                    </div>
                    <div class="col-12 col-md-12 col-lg-6 offset-lg-1">
                      <div class="form-group group col-md-12 col-12 enter_cap">
                        <input type="text" class="form-control cus-form-control" id="input_captcha_reset_otp_captcha"
                          onkeyup="onKeyUpHandler(event,'_reset_otp_captcha')" name="otp_captcha">
                        <label class="form__label" for="">Enter the Validation code :</label>
                        <span id="captcha_msg_reset_otp_captcha"></span>

                        <button type="button" id="generateOtpBtn" data-action="fresh-otp"
                          class="btn_submit quick-btn mt-2">Generate OTP</button>
                      </div>

                      <p style="margin:10px 0; font-size:14px;">
                        Didn't receive the OTP? You can resend it after 2 minutes:
                        <span id="counterDown2Min">02:00 minuts</span>
                      </p>

                    </div>
                  </div>

                  <div class="form-group group col-md-12 col-12">
                    <input type="text" name="mobile_otp" id="resetPassOTP" class="form-control cus-form-control"
                      maxlength="6" onkeyup="onKeyUpOTPHandler(event,'_reset_otp_verify')"
                      onkeypress="return isNumber(event)" disabled="disabled">
                    <label class="form__label" for="">Enter OTP for request ID : <span id="requestId"
                        class="text-success"></span> </label>
                    <span id="otp_msg_reset_otp_verify">
                    </span>
                  </div>

                  <span id="otp-verification"></span>
                  <div class="row ">
                    <div class="col-12 col-md-12 col-lg-5">
                      <div class="form-group form_cust_flex">
                        <label id="cap" class="captcha-label mr-4">
                          <span id="captcha_preview_reset_captcha" class="captcha-code">743889</span>
                        </label>
                        <a href="javascript:refreshCaptcha('_reset_captcha');" id="reload-captcha">
                          <img src="https://delhihighcourt.nic.in/app/rti/public/new_design/images/refresh.png" alt="">
                        </a>
                        <a href="javascript: playAudio('_reset_captcha');">
                          <img
                            src="https://delhihighcourt.nic.in/app/rti/public/new_design/images/volume-high-solid.png"
                            alt="">
                        </a>
                      </div>

                      <audio id="myAudio_reset_captcha">
                        <source src="" type="audio/wav">
                        Your browser does not support the audio element.
                      </audio>
                      <input type="hidden" name="captcha_code_reset_captcha" id="captcha_code_reset_captcha"
                        value="743889">
                    </div>
                    <div class="col-12 col-md-12 col-lg-6 offset-lg-1">
                      <div class="form-group group col-md-12 col-12 enter_cap">
                        <input type="text" class="form-control cus-form-control" id="input_captcha_reset_captcha"
                          name="reset_captcha" onkeyup="onKeyUpHandler(event,'_reset_captcha')" disabled="disabled">
                        <label class="form__label" for="">Enter the Security code :</label>
                        <span id="captcha_msg_reset_captcha"></span>
                      </div>
                    </div>
                  </div>
                  <div class="">
                    <button type="submit" id="btnSubmit" class="btn_submit quick-btn"
                      disabled="disabled">Submit</button>
                  </div>
                </form>
                <div class="forgot_content d-flex justify-content-center">
                  <p> <a href="https://delhihighcourt.nic.in/app/rti/login">Go back to login page</a></p>
                </div>

              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
    <!-- Edn main section  -->

    <!-- start footer  -->
    <footer class="bg_footer">
      <div class="container">
        <div class="row">
          <div class="col-md-12">
            <div class="footer-content">
              <p>Copyright © 2026. Delhi High Court. All Rights Reserved.</p>
            </div>
          </div>
        </div>
      </div>
    </footer>
    <!-- Edn footer  -->
  </div>

  <script src="./assets/js/bootstrap.bundle.min.js"></script>
  <script src="./assets/js/jquery.min.js.download"></script>
  <script type="text/javascript" src="./assets/js/jsvalidation.js"></script>
  <!-- blockUI -->
  <script src="./assets/js/jquery.blockUI.js"></script>
  <script src="./assets/js/custom.js"></script>
</body>

</html>
