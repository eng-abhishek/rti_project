<!doctype html>
<html lang="en">

<head>
  <title>DHC RTI</title>
  <link rel="stylesheet" href="./assets/css/bootstarp.min.css">
  <link rel="stylesheet" href="./assets/css/bootstrap-icons.min.css">
  <link rel="stylesheet" href="./assets/css/bootstrap-icons.woff">
  <link rel="stylesheet" href="./assets/css/bootstrap-icons.woff2">
  <link rel="stylesheet" href="./assets/css/style.css">
  <link rel="stylesheet" href="./assets/css/responsive.css">
</head>

<body>
  <div class="main">
    <header class="header_bg">
      <div class="container">
        <div class="row">
          <div class="col-md-12">
            <div class="logo_content login_page_">
              <a href="#">
                <img src="#" alt=""></a>
              <div class="logo-content">
                <h4>High Court of Delhi</h4>
                <h4>RTI System</h4>
              </div>
              <a href="#">
                <img src="./assets/logo/Emblem_of_India.svg" alt="" class="emblem w-100"></a>
            </div>
          </div>
        </div>
      </div>
    </header>
    <!-- start main section  -->
    <section class="bg_spacing">
      <div class="container">
        <div class="bg_drop_shd-login">
          <div class="row">
            <div class="col-md-12 col-lg-12 cus_col_form ">
              <div class="form_heading">
                <h4>Reset Password using security question</h4>
                <form class="input_cust" method="post"
                  action="#"
                  id="resetPassSecurity">
                  <div class="form-group group col-md-12 col-12">
                    <input type="text" name="email_id" value="" class="form-control cus-form-control" placeholder="">
                    <label class="form__label" for="">Username <span class="error">(email ID)</span></label>
                  </div>

                  <div class="form-group group col-md-12 col-12">
                    <select name="security_question" class="form-select cus-form-control" id="securityquestion">
                      <option value="">-- Select Question --</option>
                      <option value="What is your Mother's maiden name?">What is your Mother's maiden name?</option>
                      <option value="What is the name of your first School?">What is the name of your first School?
                      </option>
                      <option value="What is the name of your favourite book?">What is the name of your favourite book?
                      </option>
                      <option value="Which city were you born in?">Which city were you born in?</option>
                    </select>
                    <span class="text-danger">
                    </span>
                    <label class="form__label" for="">Security Question: </label>
                  </div>

                  <div class="form-group group col-md-12 col-12">
                    <input type="text" name="security_answer" value="" class="form-control cus-form-control"
                      placeholder="" value="">
                    <label class="form__label" for="">Security Answer:</label>
                  </div>
                  <div class="row">
                    <div class="col-12 col-md-12 col-lg-5">
                      <div class="form-group form_cust_flex">
                        <label id="cap" class="captcha-label mr-4">
                          <span id="captcha_preview_reset_pass_security_quest" class="captcha-code">196893</span>
                        </label>
                        <a href="javascript:refreshCaptcha('_reset_pass_security_quest');" id="reload-captcha">
                          <img src="#" alt="">
                        </a>
                        <a href="javascript: playAudio('_reset_pass_security_quest');">
                          <img
                            src="https://delhihighcourt.nic.in/app/rti/public/new_design/images/volume-high-solid.png"
                            alt="">
                        </a>
                      </div>
                      <audio id="myAudio_reset_pass_security_quest">
                        <source src="" type="audio/wav">
                        Your browser does not support the audio element.
                      </audio>
                    </div>
                    <div class="col-12 col-md-12 col-lg-6 offset-lg-1">
                      <div class="form-group group col-md-12 col-12 enter_cap">
                        <input type="text" class="form-control cus-form-control" name="input_captcha"
                          id="input_captcha_reset_pass_security_quest"
                          onkeyup="onKeyUpHandler(event,'_reset_pass_security_quest')">
                        <label class="form__label" for="">Enter Security Code:</label>
                        <span id="captcha_msg_reset_pass_security_quest"></span>
                      </div>
                    </div>
                  </div>
                  <div class="">
                    <button type="submit" name="btnSubmit" id="btnSubmit" class="btn_submit quick-btn">Submit</button>
                  </div>
                </form>
                <div class="forgot_content d-flex justify-content-center">
                  <p> <a href="#">Go back to login page</a></p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
    <!-- Edn main section  -->

    <!-- start footer  -->
    <footer class="bg_footer">
      <div class="container">
        <div class="row">
          <div class="col-md-12">
            <div class="footer-content">
              <p>Copyright © 2026. Delhi High Court. All Rights Reserved.</p>
            </div>
          </div>
        </div>
      </div>
    </footer>
    <!-- Edn footer  -->
  </div>

  <script src="./assets/js/bootstrap.bundle.min.js"></script>
  <script src="./assets/js/jquery.min.js.download"></script>
  <script type="text/javascript" src="./assets/js/jsvalidation.js"></script>
  <!-- blockUI -->
  <script src="./assets/js/jquery.blockUI.js"></script>
  <script src="./assets/js/custom.js"></script>
</body>

</html>
